# ==============================================================================
# PreCare Render Free Tier Blueprint Specification
# Free-tier deployable without Docker, Kubernetes, or complex DevOps
# ==============================================================================
services:
  - type: web
    name: precare-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://precare-five.vercel.app
      - key: AI_PROVIDER
        value: api
      - key: AI_API_BASE
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: AI_API_KEY
        sync: false
